<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Revisor do Slack</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f7f7f8;
    --text: #1d1c1d;
    --muted: #616061;
    --border: #e1e1e3;
    --accent: #1264a3;
    --on-accent: #ffffff;
    --ok: #007a5a;
    --warn: #b35900;
    --err: #c0392b;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d21;
      --surface: #222529;
      --text: #e8e8e8;
      --muted: #9a9b9d;
      --border: #35373b;
      --accent: #4ea4f0;
      --on-accent: #0b1a26;
      --ok: #2bac76;
      --warn: #e8a33d;
      --err: #f0645a;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 320px; margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [hidden] { display: none !important; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }

  #conv-name { font-weight: 650; overflow-wrap: anywhere; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .switch-row label { flex: 1; cursor: pointer; }
  input[role="switch"] {
    appearance: none; flex: none; width: 34px; height: 20px; margin: 0; cursor: pointer;
    border-radius: 10px; background: var(--border); position: relative; transition: background .15s;
  }
  input[role="switch"]::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--bg); transition: transform .15s;
  }
  input[role="switch"]:checked { background: var(--accent); }
  input[role="switch"]:checked::after { transform: translateX(14px); }

  .global { padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid var(--border); }
  .global .switch-row { margin-top: 0; font-weight: 600; }
  .ask { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
  .ask label { display: block; font-weight: 600; margin-bottom: 6px; }
  .scope {
    display: flex; gap: 2px; padding: 2px; margin-bottom: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
  }
  .scope label { flex: 1; margin: 0; font-weight: 500; font-size: 13px; text-align: center; padding: 4px 8px; border-radius: 4px; cursor: pointer; color: var(--muted); }
  .scope input { position: absolute; opacity: 0; pointer-events: none; }
  .scope label:has(input:checked) { background: var(--bg); color: var(--text); box-shadow: 0 0 0 1px var(--border); }
  .scope label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 1px; }
  #reload-note { margin-top: 8px; }
  textarea {
    width: 100%; padding: 8px 10px; font: inherit; color: var(--text); resize: vertical;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  textarea::placeholder { color: var(--muted); }
  input:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer;
    color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  button:hover { background: var(--surface); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { background: var(--accent); filter: brightness(1.1); }
  button.link { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; }
  button.link:hover { color: var(--text); background: none; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

  #result { margin-top: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  #result .actions { margin-top: 10px; }
  #status { margin-top: 8px; font-size: 13px; color: var(--muted); }
  #status[data-tone="err"] { color: var(--err); }
  #status[data-tone="ok"] { color: var(--ok); }

  footer { margin-top: 16px; font-size: 13px; }
</style>
</head>
<body>
  <section class="global" aria-label="Revisor">
    <div class="switch-row">
      <label for="global-toggle">Revisor ligado</label>
      <input id="global-toggle" type="checkbox" role="switch" checked>
    </div>
  </section>

  <section aria-label="Esta conversa" id="conv-section">
    <p id="conv-name" hidden></p>
    <div class="switch-row" id="switch-row" hidden>
      <label for="toggle">Revisar nesta conversa</label>
      <input id="toggle" type="checkbox" role="switch">
    </div>
    <p class="muted" id="not-slack" hidden>Abra uma conversa no Slack para ligar ou desligar a revisão nela.</p>
    <p class="muted" id="reload-note" hidden>Recarregue esta aba do Slack para a revisão funcionar nela.</p>
  </section>

  <section class="ask" aria-label="Pedir um ajuste">
    <label for="request">Peça um ajuste</label>
    <div class="scope" id="scope" role="radiogroup" aria-label="O ajuste vale para" hidden>
      <label><input type="radio" name="scope" value="conversation" checked>Nesta conversa</label>
      <label><input type="radio" name="scope" value="all">Em todas</label>
    </div>
    <textarea id="request" rows="3" maxlength="500" placeholder="Ex.: aqui pode ser mais informal · não revise mensagens em inglês · nunca troque 'vcs' por 'vocês'"></textarea>
    <div class="actions"><button id="ask" type="button" class="primary">Pedir</button></div>

    <div id="result" hidden>
      <p id="result-text"></p>
      <div class="actions" id="result-actions">
        <button id="adjust" type="button">Ajustar pedido</button>
        <button id="save" type="button" class="primary">Salvar</button>
      </div>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>

  <footer><button id="options" type="button" class="link">Regras e configurações</button></footer>
<script src="convo.js"></script>
<script src="popup.js"></script>
</body>
</html>
